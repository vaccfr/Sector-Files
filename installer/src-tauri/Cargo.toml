[package]
name = "controller-pack-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vACC France controller pack installer / updater"
authors = ["vACC France"]

# NOTE: the lib name must not contain install/setup/update/patch — Windows
# installer-detection would force a UAC prompt on the test binary
# (`<libname>-<hash>.exe`), breaking `cargo test` with os error 740.
[lib]
name = "controller_pack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
controller-pack-core = { path = "../core" }

tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
