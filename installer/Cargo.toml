[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
regex = "1"
globset = "0.4"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
