# This name is required by the autofix.ci service.
name: autofix.ci

on:
  pull_request:
    branches: [main]

# PR code runs without write credentials, including for forks. The autofix.ci
# GitHub App applies the resulting fixes to the PR branch, before review/merge.
permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: ASR and PRF autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Maintain ASR and PRF files
        run: python .github/scripts/asr_prf_maintenance.py

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: maintain ASR and PRF files"
          fail-fast: false
