name: Build Controller Pack Logon Editor

on:
  workflow_dispatch:
  push:
    branches:
      - AIRAC-2605
      - main
    paths:
      - "scripts/profile-editor/**"
      - ".github/workflows/build-logon-editor.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        working-directory: scripts/profile-editor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        working-directory: scripts/profile-editor
        run: |
          pyinstaller ControllerPackLogonEditor.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControllerPackLogonEditor
          path: scripts/profile-editor/dist/ControllerPackLogonEditor.exe
